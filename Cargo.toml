[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/api", "crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
rig-domain = { path = "crates/domain" }
rig-application = { path = "crates/application" }
rig-infrastructure = { path = "crates/infrastructure" }
rig-api = { path = "crates/api" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
russh = { version = "=0.61.2", default-features = false, features = ["ring"] }
rmcp = { version = "0.8.5", features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1", "chrono04"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
futures-util = "0.3"
argon2 = "0.5"
aes-gcm = "0.10"
subtle = "2"

[profile.release]
lto = "thin"
strip = true
