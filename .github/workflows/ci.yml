name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rigdeck
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: rigdeck_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rigdeck -d rigdeck_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://rigdeck:ci-test-only@localhost:5432/rigdeck_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p rig-infrastructure --test postgres -- --ignored
      - run: python3 tests/redfish/run.py
      - run: python3 tests/check_boundaries.py
      - run: python3 tests/test_dependencies.py
      - run: python3 tests/test_bios.py
      - run: python3 tests/test_gpu_oc.py
      - run: cargo run -q -p rigdeck -- openapi > openapi.json
      - run: npm ci --no-audit --no-fund && npm run types && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- openapi.json frontend/src/shared/schema.d.ts
      - run: sudo apt-get update && sudo apt-get install -y screen jq curl
      - run: sudo -E python3 tests/test_runtime.py
      - run: npx playwright install --with-deps chrome
        working-directory: frontend
      - name: Browser and API integration
        env:
          RIGDECK_TEST_DATABASE_URL: postgres://rigdeck:ci-test-only@localhost:5432/rigdeck_test
        run: |
          cargo build -p rigdeck
          python3 tests/dev_server.py --work /tmp/rigdeck-ci
          npm --prefix frontend run dev > /tmp/rigdeck-vite.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          npm --prefix frontend run test:e2e
